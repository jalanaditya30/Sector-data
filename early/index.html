<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Momentum Radar</title><link rel="stylesheet" href="../boards.css"><style>
:root{--bg:#eef1f6;--card:#fff;--line:#dce3ec;--ink:#17202b;--dim:#667386;--up:#0b8b4b;--accent:#2f6fd0;--warn:#a76b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--card);padding:18px 22px;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0 0 4px}.sub{color:var(--dim)}.controls{padding:12px 22px;background:var(--card);display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}input,select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card)}.wrap{padding:18px 22px;overflow:auto}table{width:100%;min-width:1200px;border-collapse:collapse;background:var(--card)}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{font-size:11px;color:var(--dim);text-transform:uppercase;cursor:pointer;position:sticky;top:55px;background:var(--card)}th:first-child,td:first-child{text-align:left}.sym{font-weight:750}.name{font-size:11px;color:var(--dim);display:block}.stage{font-weight:700}.strong{color:var(--up)}.emerge{color:var(--accent)}.watch{color:var(--warn)}.flag{display:inline-block;font-size:10px;padding:2px 5px;margin:1px;border-radius:4px;background:#eef4ff;color:#315f9d}.num{font-variant-numeric:tabular-nums}.muted{color:var(--dim)}.bad{opacity:.45}.sectorbox{padding:0 22px 12px;background:var(--card);color:var(--dim);font-size:12px}</style></head><body>
<header><h1>Early Momentum Radar</h1><div class="sub">Find stocks moving from ignored → accumulated → momentum. Discovery screen, not a buy signal.</div></header>
<div class="sectorbox" id="meta">Loading full market…</div>
<div class="controls"><input id="q" placeholder="Search stock / sector"><select id="stage"><option value="active">Active: Watch+</option><option>Strong emerging</option><option>Emerging</option><option>Watch</option><option value="all">All</option></select><label><input type="checkbox" id="thin"> include very thin</label><label><input type="checkbox" id="event"> include event/stale</label></div>
<div class="wrap"><table><thead><tr><th data-k="symbol">Stock</th><th data-k="stage">Stage</th><th data-k="radar_score">Confirm.</th><th data-k="r5">5D</th><th data-k="r20">20D</th><th data-k="accel">Price accel</th><th data-k="rvol">Turnover ×</th><th data-k="obv_slope">OBV</th><th data-k="market_rs">vs Nifty</th><th data-k="sector_rs">vs sector</th><th data-k="eff20">Efficiency</th><th data-k="from_high60">60D high</th><th>Signals</th></tr></thead><tbody id="body"></tbody></table></div>
<script>
let data=[],sort='radar_score',dir=-1;const $=x=>document.getElementById(x);const n=(v,d=2)=>v==null?'—':Number(v).toFixed(d);const cls=s=>s==='Strong emerging'?'strong':s==='Emerging'?'emerge':s==='Watch'?'watch':'';
function render(){let q=$('q').value.toLowerCase(),st=$('stage').value,thin=$('thin').checked,event=$('event').checked;let rows=data.filter(r=>(!q||(r.symbol+' '+r.name+' '+r.sector).toLowerCase().includes(q))&& (thin||!r.thin)&&(event||(!r.event&&!r.stale))&&(st==='all'||(st==='active'?['Strong emerging','Emerging','Watch'].includes(r.stage):r.stage===st)));rows.sort((a,b)=>{let A=a[sort],B=b[sort];if(A==null)return 1;if(B==null)return-1;return (typeof A==='string'?A.localeCompare(B):A-B)*dir});$('body').innerHTML=rows.map(r=>`<tr class="${r.thin?'bad':''}"><td><span class="sym">${r.symbol}</span><span class="name">${r.name} · ${r.sector}</span></td><td class="stage ${cls(r.stage)}">${r.stage}</td><td class="num"><b>${n(r.radar_score,2)}</b> / ${r.flags.length}</td><td class="num">${n(r.r5)}%</td><td class="num">${n(r.r20)}%</td><td class="num">${n(r.accel,3)}</td><td class="num"><b>${n(r.rvol)}×</b></td><td class="num">${n(r.obv_slope,3)}${r.obv_div?' ★':''}</td><td class="num">${n(r.market_rs)}%</td><td class="num">${n(r.sector_rs)}%</td><td class="num">${n(r.eff20,3)}</td><td class="num">${n(r.from_high60)}%</td><td>${r.flags.map(f=>`<span class="flag">${f.replaceAll('_',' ')}</span>`).join('')}</td></tr>`).join('');}
fetch('early.json?'+Date.now()).then(r=>r.json()).then(j=>{data=j.rows;$('meta').textContent=`${j.resolved} stocks scanned of ${j.requested} · ${Object.keys(j.sectors||{}).length} sector groups · updated ${new Date(j.generated).toLocaleString()} · default view deliberately hides noise, thin and event-driven names`;render()}).catch(e=>$('meta').textContent='Data not built yet — run the Early Momentum workflow once.');
['q','stage','thin','event'].forEach(x=>$(x).addEventListener('input',render));document.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{let k=h.dataset.k;if(sort===k)dir*=-1;else{sort=k;dir=-1}render()});
</script></body></html>
