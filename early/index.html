<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Momentum Radar</title><style>
:root{--bg:#f3f6fa;--card:#fff;--line:#dce4ee;--ink:#17202b;--dim:#6b7789;--green:#087a43;--blue:#2468d4;--amber:#996000;--red:#b3372f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:1500px;margin:auto}.top{padding:18px 16px 12px;background:#fff;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 4px}.sub,.muted{color:var(--dim)}.stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;padding:12px 16px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:23px;display:block}.filters{display:grid;grid-template-columns:minmax(180px,2fr) minmax(190px,1fr) repeat(2,max-content);gap:10px;align-items:center;padding:0 16px 12px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}label.check{display:flex;gap:7px;align-items:center;white-space:nowrap}.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:0 16px 20px}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{font-size:11px;color:var(--dim);text-transform:uppercase;cursor:pointer;background:#fafbfd;position:sticky;top:0}th:first-child,td:first-child{text-align:left}.sym{font-weight:800}.name{display:block;color:var(--dim);font-size:11px}.badge{font-weight:700;padding:3px 7px;border-radius:999px;display:inline-block}.Discovery{background:#e8f7ee;color:var(--green)}.Confirming{background:#eaf2ff;color:var(--blue)}.Watch{background:#fff4dc;color:var(--amber)}.Momentum{background:#eef0ff;color:#5147b9}.late{background:#fdebea;color:var(--red)}.up{color:var(--green)}.down{color:var(--red)}.flags{white-space:normal;min-width:190px}.flag{font-size:10px;background:#f0f4f8;padding:2px 5px;border-radius:5px;margin:1px;display:inline-block}.cards{display:none}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.cardhead{display:flex;justify-content:space-between;gap:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.metric{background:#f7f9fc;border-radius:8px;padding:7px}.metric small{display:block;color:var(--dim);font-size:10px}.metric b{font-size:13px}.panel h2{font-size:16px;margin:0 0 4px}.btrow{display:grid;grid-template-columns:1.4fr repeat(4,.8fr);gap:4px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}.btrow.head{color:var(--dim);font-size:10px;text-transform:uppercase}.note{font-size:11px;color:var(--dim);margin-top:9px}.empty{padding:30px;text-align:center;color:var(--dim)}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.main{grid-template-columns:1fr}.side{order:-1}.tablewrap{display:none}.cards{display:block}.panel{border-radius:10px}.top{padding-top:14px}h1{font-size:20px}}
@media(max-width:560px){.stats{padding:10px;gap:8px}.stat{padding:10px}.stat b{font-size:19px}.filters{grid-template-columns:1fr;padding:0 10px 10px}.main{padding:0 10px 16px}.grid{grid-template-columns:repeat(2,1fr)}.sub{font-size:13px}.btrow{grid-template-columns:1.2fr repeat(4,.75fr);font-size:11px}.top{padding-left:12px;padding-right:12px}}
</style></head><body><div class="shell">
<div class="top"><h1>Early Momentum Radar <span class="muted">v2</span></h1><div class="sub">Find participation arriving before the move becomes obvious.</div><div class="muted" id="meta">Loading…</div></div>
<div class="stats"><div class="stat"><b id="resolved">—</b><span>Stocks resolved</span></div><div class="stat"><b id="discover">—</b><span>Discovery</span></div><div class="stat"><b id="confirm">—</b><span>Confirming</span></div><div class="stat"><b id="sectors">—</b><span>Sector groups</span></div></div>
<div class="filters"><input id="q" placeholder="Search stock or sector"><select id="stage"><option value="early">Discovery + Confirming</option><option>Discovery</option><option>Confirming</option><option>Watch</option><option>Momentum</option><option>Late / Event</option><option value="all">All</option></select><label class="check"><input type="checkbox" id="thin"> Very thin</label><label class="check"><input type="checkbox" id="review"> Review/no setup</label></div>
<div class="main"><div><div class="tablewrap"><table><thead><tr><th data-k="symbol">Stock</th><th data-k="stage">Stage</th><th data-k="radar_score">Score</th><th data-k="r5">5D</th><th data-k="r20">20D</th><th data-k="rvol">Turnover</th><th data-k="turnover_cr">₹/day</th><th data-k="obv_slope">OBV</th><th data-k="market_rs">vs Nifty</th><th data-k="sector_rs">vs sector</th><th data-k="from_high60">60D high</th><th>Reasons</th></tr></thead><tbody id="body"></tbody></table></div><div class="cards" id="cards"></div></div>
<div class="side"><div class="panel"><h2>1-Year Walk-Forward Test</h2><div class="muted" id="btmeta">Loading backtest…</div><div class="btrow head"><span>Stage</span><span>N</span><span>Win</span><span>20D</span><span>Alpha</span></div><div id="bt"></div><div class="note" id="btnote"></div></div></div></div></div>
<script>
let data=[],sort='radar_score',dir=-1;const $=x=>document.getElementById(x);const num=(v,d=2)=>v==null?'—':Number(v).toFixed(d);const pct=v=>v==null?'—':num(v,1)+'%';const c=v=>v>0?'up':v<0?'down':'';const badge=s=>`<span class="badge ${s==='Late / Event'?'late':s}">${s}</span>`;
function filtered(){let q=$('q').value.toLowerCase(),st=$('stage').value,thin=$('thin').checked,review=$('review').checked;let r=data.filter(x=>(!q||(x.symbol+' '+x.name+' '+x.sector).toLowerCase().includes(q))&&(thin||!x.thin)&&(review||!['Review','No setup'].includes(x.stage))&&(st==='all'||(st==='early'?['Discovery','Confirming'].includes(x.stage):x.stage===st)));return r.sort((a,b)=>{let A=a[sort],B=b[sort];if(A==null)return 1;if(B==null)return-1;return(typeof A==='string'?A.localeCompare(B):A-B)*dir})}
function render(){let rows=filtered();$('body').innerHTML=rows.map(r=>`<tr><td><span class="sym">${r.symbol}${r.fallback?' *':''}</span><span class="name">${r.name} · ${r.sector}</span></td><td>${badge(r.stage)}</td><td><b>${num(r.radar_score)}</b></td><td class="${c(r.r5)}">${pct(r.r5)}</td><td class="${c(r.r20)}">${pct(r.r20)}</td><td><b>${num(r.rvol)}×</b></td><td>₹${num(r.turnover_cr)}cr</td><td>${num(r.obv_slope,2)}${r.obv_div?' ★':''}</td><td class="${c(r.market_rs)}">${pct(r.market_rs)}</td><td class="${c(r.sector_rs)}">${pct(r.sector_rs)}</td><td>${pct(r.from_high60)}</td><td class="flags">${r.flags.map(f=>`<span class="flag">${f.replaceAll('_',' ')}</span>`).join('')}</td></tr>`).join('');$('cards').innerHTML=rows.map(r=>`<div class="card"><div class="cardhead"><div><span class="sym">${r.symbol}</span><span class="name">${r.name} · ${r.sector}</span></div>${badge(r.stage)}</div><div class="grid"><div class="metric"><small>Early score</small><b>${num(r.radar_score)}</b></div><div class="metric"><small>5D</small><b class="${c(r.r5)}">${pct(r.r5)}</b></div><div class="metric"><small>20D</small><b class="${c(r.r20)}">${pct(r.r20)}</b></div><div class="metric"><small>Turnover</small><b>${num(r.rvol)}×</b></div><div class="metric"><small>₹ / day</small><b>₹${num(r.turnover_cr)}cr</b></div><div class="metric"><small>OBV</small><b>${num(r.obv_slope,2)}${r.obv_div?' ★':''}</b></div><div class="metric"><small>vs Nifty</small><b class="${c(r.market_rs)}">${pct(r.market_rs)}</b></div><div class="metric"><small>vs sector</small><b class="${c(r.sector_rs)}">${pct(r.sector_rs)}</b></div></div><div class="flags" style="margin-top:9px">${r.flags.map(f=>`<span class="flag">${f.replaceAll('_',' ')}</span>`).join('')}</div></div>`).join('')||'<div class="empty">No matching stocks</div>'}
fetch('early.json?'+Date.now()).then(r=>r.json()).then(j=>{data=j.rows;$('resolved').textContent=j.resolved;$('discover').textContent=data.filter(x=>x.stage==='Discovery').length;$('confirm').textContent=data.filter(x=>x.stage==='Confirming').length;$('sectors').textContent=Object.keys(j.sectors||{}).length;$('meta').textContent=`${j.resolved}/${j.requested} stocks · updated ${new Date(j.generated).toLocaleString()}`;render()});
fetch('one_year_backtest.json?'+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(j=>{$('btmeta').textContent=`${j.start} → ${j.end} · ${j.trading_days} trading days`;let stages=['Discovery','Confirming','Watch','Momentum','Late / Event'];$('bt').innerHTML=stages.map(s=>{let x=(j.primary20||{})[s]||{};return `<div class="btrow"><span>${badge(s)}</span><span>${x.n??0}</span><span>${pct(x.win_rate)}</span><span class="${c(x.median_return)}">${pct(x.median_return)}</span><span class="${c(x.median_alpha)}">${pct(x.median_alpha)}</span></div>`}).join('');$('btnote').textContent=(j.limitation||'')}).catch(()=>{$('btmeta').textContent='Not generated yet. Run the 1-Year Backtest workflow.';$('bt').innerHTML='';$('btnote').textContent='This panel will populate after the historical workflow finishes.'});
['q','stage','thin','review'].forEach(x=>$(x).addEventListener('input',render));document.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{let k=h.dataset.k;if(sort===k)dir*=-1;else{sort=k;dir=-1}render()});
</script></body></html>
