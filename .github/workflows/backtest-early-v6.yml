name: backtest-early-v6
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "yfinance>=0.2.40" "pandas>=2.0" "numpy>=1.24"
      - name: run V6 accumulation behaviour-change research lab
        run: python early/v6_research.py
      - name: commit V6 research results safely
        run: |
          git config user.name "early-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f early/v6_research.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "early: V6 research lab $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 4; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
