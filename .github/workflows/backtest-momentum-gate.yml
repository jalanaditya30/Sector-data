name: backtest-momentum-gate
on:
  workflow_dispatch:
  push:
    paths:
      - early/momentum_test.py
      - .github/workflows/backtest-momentum-gate.yml
permissions:
  contents: write
concurrency:
  group: backtest-momentum-gate
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "yfinance>=0.2.40" "pandas>=2.0" "numpy>=1.24"
      - name: restore momentum raw frames and panel cache
        uses: actions/cache@v4
        with:
          path: early/.cache
          key: momentum-gate-${{ runner.os }}-${{ hashFiles('trend/universe.txt', 'early/momentum_decision_rule.json') }}-2
      - name: run pre-registered momentum gate
        run: python early/momentum_test.py
      - name: commit result only
        run: |
          git config user.name "early-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f early/momentum_test_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: momentum gate result $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 4; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
