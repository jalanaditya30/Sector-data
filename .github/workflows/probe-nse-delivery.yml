name: probe-nse-delivery
on:
  workflow_dispatch:
  push:
    paths:
      - early/nse_delivery_probe.py
      - .github/workflows/probe-nse-delivery.yml
permissions:
  contents: write
concurrency:
  group: probe-nse-delivery
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install "requests>=2.31" "pandas>=2.0" "numpy>=1.24" "yfinance>=0.2.40"
      - name: run feasibility probe only
        run: python early/nse_delivery_probe.py
      - name: commit probe result only
        run: |
          git config user.name "early-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f early/nse_delivery_probe_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: NSE delivery feasibility result $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 4; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
