name: weekly-shortlist

# Weekly, not daily. Formation is 12 months and the tested holding period is 40
# sessions; regenerating daily would churn the list far faster than the rule that
# was validated, and invite reacting to noise. Weekly also matches the sampling
# cadence of the test that passed.

on:
  schedule:
    - cron: "20 12 * * 6"      # Saturday 17:50 IST, after the week's data settles
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-shortlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild constraint universe
        run: python early/constraint_layer.py

      - name: Build shortlist
        run: python early/shortlist.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add early/screen/constraint_universe.txt \
                  early/screen/constraint_report.json \
                  early/screen/shortlist.json \
                  early/screen/shortlist.md
          git diff --staged --quiet || git commit -m "weekly shortlist $(date -u +%Y-%m-%d)"
          git push
