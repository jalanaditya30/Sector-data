name: backtest-early-1y
on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 1 * *"   # monthly refresh, after NSE close
permissions:
  contents: write
concurrency:
  group: backtest-early-1y
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "yfinance>=0.2.40" "pandas>=2.0" "numpy>=1.24"
      - name: run one-year daily walk-forward test
        working-directory: early
        run: python one_year_backtest.py
      - name: commit results
        run: |
          git config user.name "early-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f early/one_year_backtest.json
          git diff --cached --quiet || git commit -m "early: 1y backtest $(date -u +%FT%TZ)"
          git push
