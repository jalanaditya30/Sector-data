name: run-constraint-layer
on:
  workflow_dispatch:
  push:
    paths:
      - early/constraint_layer.py
      - .github/workflows/run-constraint-layer.yml
permissions:
  contents: write
concurrency:
  group: run-constraint-layer
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "requests>=2.31" "pandas>=2.0" "numpy>=1.24" "yfinance>=0.2.40"
      - name: run mechanical constraint layer
        run: python early/constraint_layer.py
      - name: commit constraint outputs
        run: |
          git config user.name "early-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f early/screen/constraint_universe.txt early/screen/constraint_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "screen: refresh constraint universe $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 4; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
